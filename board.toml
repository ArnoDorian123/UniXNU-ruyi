# Board description of the Xiaomi MIX Flip (ruyi, SM8650), read by the unixnu build driver.
# Derived from UniXNU-sheng/board.toml; values marked TODO need a decision or a measurement.

[board]
name = "ruyi"
soc = "SM8650"
description = "Xiaomi MIX Flip"
kit = "ruyi"

# The target OS image: the same iPad7,1 iPadOS 17.7.11 restore image the sheng and giulia ports use.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

# userdata of LUN 0, read from the device:
#   start  = 20705280 (512-byte sectors) -> 2588160 in 4 KiB units
#   length = 1008291800 (512-byte sectors) -> 516,245,401,600 bytes
[userdata]
first_lba = 2588160
last_lba = 128624634
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "ruyi_defconfig"
# build-arm-driver.py exists only in device repositories, not in UniXNU/scripts.
# build-ruyi-display-stubs.py satisfies the XNU_NATIVE_LEGACY_DISPLAY=1 link contract without
# sheng's audit data (it writes build/native-legacy-display/libNativeLegacyDisplay.late.a).
# NativeUfs is postponed to M3: it references boot-progress, verified-root and IOStorageFamily
# symbols that only the full sheng feature stack links.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-ruyi-display-stubs.py",
  "build-libpthread-kernel.py",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

[firmware]
# uefi-ruyi is a fork of UniXNU/uefi-sheng (Mu-Silicium + the Xiaomi platform packages).
# ruyiPkg is a copy of shengPkg with the LanaiPkg SoC include and ruyi PCDs.
config = "ruyi"
dsc = "Platforms/Xiaomi/ruyiPkg/ruyi.dsc"
fd = "Build/ruyiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
# No preflight script yet: a missing one aborts the firmware step. Add scripts/check-ruyi.py
# to the device repository first if vendor inputs ever need validation.
preflight = []
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
# uefi-ruyi is a fork of Project-Silicium/Mu-Silicium; its Resources/MuPatches has
# AsmMacroLib, Auth-Service, Boot-Manager, Timer and Usb-Bus, but not Gic-Spurious.patch.
# sheng applies that patch; ruyi starts without it and adds it only if the GIC misbehaves.
patches = []
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "ruyi"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "ruyi-research"

[payload]
volume = "RUYIESP"
size_mib = 192
loader = "firmware"
title = "Boot"
# The DarwinBoot handoff window used by the giulia port. Not the installed 12 GB.
dram_size = "0x10000000"
panic_screen = true
timeout = 3
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "armcpu-diagnostics=1",
]

[payload.adt]
tool = "scripts/make-ruyi-adt.py"
chip_id = "0"
owned_memory_size = "0x10000000"
cpu_regs = "0"
psci_method = "smc"

